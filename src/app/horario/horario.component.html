<div class="container">
    <!-- FORMULARIO -->
    <section class="form-card">
      <h2>{{ editingId ? 'Editar Horario' : 'Nuevo Horario' }}</h2>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <label>Hora Salida
          <input  formControlName="hora_salida" />
        </label>
        <label>Hora antes
          <input  formControlName="notas" />
        </label>
       

        <label class="checkbox-label">
          <input type="checkbox" formControlName="estado" />
          Activo
        </label>
  
        <div class="btn-group">
          <button type="submit" [disabled]="form.invalid">
            {{ editingId ? 'Actualizar' : 'Guardar' }}
          </button>
          <button type="button" class="cancel" (click)="cancelEdit()" *ngIf="editingId">
            Cancelar
          </button>
        </div>
        <div class="error" *ngIf="errorMsg">{{ errorMsg }}</div>
      </form>
    </section>
  
    <!-- LISTA Y BÚSQUEDA -->
    <section class="list-card">
      <div class="search-bar">
        <input type="number" placeholder="Buscar por ID" [(ngModel)]="searchId" name="searchId" />
        <button (click)="search()">🔍</button>
        <button (click)="loadAll()">↺</button>
      </div>
  
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Salida</th><th>Antes</th><th>Activo</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let h of horarios">
            <td>{{ h.id }}</td>
            <td>{{ h.hora_salida }}</td>
            <td>{{ h.notas }}</td>
            <td>{{ h.estado ? 'Sí' : 'No' }}</td>
            <td class="actions">
              <button (click)="edit(h)">
                ✏️
                <span class="tooltip">Editar viaje</span>
              </button>
            
              <button (click)="delete(h.id!)">
                🗑️
                <span class="tooltip">Eliminar viaje</span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
  
      <div class="loading" *ngIf="loading">Cargando…</div>
      <div class="no-data" *ngIf="!loading && horarios.length===0">No hay horarios.</div>
    </section>
  </div>
